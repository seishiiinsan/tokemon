name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, données
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Biome
        run: npm run lint
      - name: tsc --checkJs
        run: npm run typecheck
      - name: Tests (couverture core >= 80 %)
        run: npm test
      - name: Validation des données
        run: npm run check-data
